<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coding Cloud Garden - AI Lab</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght=700;900&family=Noto+Sans+KR:wght=400;700&display=swap');

:root {
  --sky1: #e0f4ff;
  --sky2: #bbf2c6;
  --text: #2c4c30;
  --card-bg: rgba(255, 255, 255, 0.9);
  --accent: #4fbf6a;
  --input-bg: #ffffff;
  --input-text: #333333;
  --tab-inactive: rgba(0, 0, 0, 0.05);
}

body.night {
  --sky1: #0b132b;
  --sky2: #1c2541;
  --text: #e1f5fe;
  --card-bg: rgba(30, 41, 59, 0.85);
  --accent: #a7f0a0;
  --input-bg: #1e293b;
  --input-text: #ffffff;
  --tab-inactive: rgba(255, 255, 255, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  transition: background 1.5s ease, color 1s;
}

/* 내비게이션 바 */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 900px;
  margin-bottom: 20px;
}

/* 홈 버튼 */
.home-btn {
  padding: 12px 24px;
  border-radius: 50px;
  border: none;
  background: var(--card-bg);
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.home-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

/* 찾기 상자 */
.search-box {
  display: flex;
  gap: 10px;
  background: var(--card-bg);
  padding: 6px 6px 6px 16px;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  align-items: center;
  width: 350px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 0.95rem;
  color: var(--input-text);
  width: 100%;
}
.search-box button {
  padding: 8px 20px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
body.night .search-box button { color: #112a1a; }
.search-box button:hover { opacity: 0.9; }

/* 탭 메뉴 스타일 */
.tab-container {
  display: flex;
  width: 100%;
  max-width: 900px;
  margin-bottom: -2px;
  gap: 5px;
  z-index: 2;
}
.tab-button {
  padding: 12px 30px;
  font-size: 1.05rem;
  font-weight: 700;
  border: none;
  border-radius: 16px 16px 0 0;
  background: var(--tab-inactive);
  color: var(--text);
  cursor: pointer;
  opacity: 0.6;
  transition: all 0.3s;
}
.tab-button.active {
  background: var(--card-bg);
  opacity: 1;
  box-shadow: 0 -5px 15px rgba(0,0,0,0.02);
}

/* 콘텐츠 카드 디자인 */
.content-card {
  width: 100%;
  max-width: 900px;
  background: var(--card-bg);
  border-radius: 0 24px 24px 24px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  line-height: 1.8;
  min-height: 500px;
}

/* 탭 내부 페이지 전환 제어 */
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}

/* [설명칸] 내부 레이아웃 (좌측 목차 / 우측 본문) */
.garden-layout {
  display: flex;
  gap: 30px;
}

/* 왼쪽 사이드바 트리 목차 */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 2px solid rgba(0, 0, 0, 0.05);
  padding-right: 15px;
}
body.night .sidebar { border-right-color: rgba(255, 255, 255, 0.05); }

/* 트리 텍스트 가독성 */
.tree-root {
  font-size: 1.05rem;
  font-weight: 700;
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.03);
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 15px;
  display: block;
}
body.night .tree-root { background: rgba(255, 255, 255, 0.03); }

.tree-folder {
  font-size: 1.05rem;
  font-weight: 700;
  margin-top: 15px;
  margin-bottom: 5px;
  opacity: 0.9;
}
.tree-list {
  list-style: none;
  padding-left: 10px;
}
.tree-item {
  padding: 6px 12px;
  margin: 2px 0;
  font-size: 0.95rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  opacity: 0.8;
}
.tree-item:hover {
  background: rgba(0, 0, 0, 0.04);
  opacity: 1;
}
body.night .tree-item:hover { background: rgba(255, 255, 255, 0.04); }

/* 클릭 메뉴 하이라이터 */
.tree-item.active, .tree-root.active {
  background: var(--accent) !important;
  color: #ffffff !important;
  font-weight: 700;
  opacity: 1;
}
body.night .tree-item.active, body.night .tree-root.active { color: #112a1a !important; }

/* 우측 뷰어 판넬 */
.viewer-panel {
  flex-grow: 1;
  min-width: 0;
}

/* 마크다운 공통 렌더링 스타일 스타일 */
.viewer-panel h1 { font-size: 2.3rem; font-weight: 900; margin-bottom: 20px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
.viewer-panel h2 { font-size: 1.6rem; margin-top: 30px; margin-bottom: 15px; color: var(--accent); }
.viewer-panel h3 { font-size: 1.2rem; margin-top: 20px; margin-bottom: 10px; }
.viewer-panel p { margin-bottom: 15px; font-size: 1.05rem; opacity: 0.9; }
.viewer-panel ul, .viewer-panel ol { margin-left: 25px; margin-bottom: 20px; }
.viewer-panel li { margin-bottom: 5px; }
.viewer-panel blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: gray; margin: 15px 0; }

/* 💻 마크다운 내부의 코드 블록 스타일 가독성 업그레이드 */
.viewer-panel pre {
  background: var(--input-bg);
  color: var(--input-text);
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
  font-family: 'Courier New', Courier, monospace;
  margin: 15px 0;
  border: 1px solid rgba(0,0,0,0.05);
}
.viewer-panel code {
  font-family: 'Courier New', Courier, monospace;
  background: rgba(0,0,0,0.05);
  padding: 2px 6px;
  border-radius: 4px;
}
body.night .viewer-panel code { background: rgba(255,255,255,0.1); }

/* 찾기 하이라이트 */
.highlight {
  background-color: #ffeb3b;
  color: #000000;
  border-radius: 2px;
  padding: 0 2px;
}
</style>
</head>
<body>

<div class="nav-bar">
  <div style="display: flex; gap: 10px;">
    <a href="index.html" class="home-btn">🌳 고 가든</a>
    <a href="recommender.html" target="_blank" class="home-btn" style="background: var(--accent); color: white;">🤖 모델 추천기 (새창)</a>
  </div>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="현재 열린 파일에서 검색..." onkeypress="if(event.key === 'Enter') handleSearch()">
    <button onclick="handleSearch()">찾기</button>
  </div>
</div>

<div class="tab-container">
  <button id="descTabBtn" class="tab-button active" onclick="switchTab('descTab', this)">📝 설명칸</button>
  <button id="codeTabBtn" class="tab-button" onclick="switchTab('codeTab', this)">💻 코딩칸</button>
</div>

<div class="content-card">
  
  <div id="descTab" class="tab-content active">
    <div class="garden-layout">
      
      <aside class="sidebar">
        <span id="baseFileBtn" class="tree-root active" onclick="loadMarkdownFile('ai.md', this)">📄 ai.md</span>
        
        <div class="tree-folder">📈 회귀</div>
        <ul class="tree-list">
          <li class="tree-item" onclick="loadMarkdownFile('regre_1.md', this)">├ 1 선형회귀</li>
          <li class="tree-item" onclick="loadMarkdownFile('regre_2.md', this)">├ 2 다중회귀</li>
          <li class="tree-item" onclick="loadMarkdownFile('regre_5.md', this)">├ 5 로지스틱</li>
          <li class="tree-item" onclick="loadMarkdownFile('regre_7.md', this)">├ 7 KNN/li>
          <li class="tree-item" onclick="loadMarkdownFile('regre_8.md', this)">├ 8 K_Fold</li>
          <li class="tree-item" onclick="loadMarkdownFile('regre_9.md', this)">├ 9 그리드서치</li>
        </ul>

        <div class="tree-folder">🌳 트리 비지도</div>
        <ul class="tree-list">
          <li class="tree-item" onclick="loadMarkdownFile('tree_2.md', this)">├ 2 앙상블</li>
          <li class="tree-item" onclick="loadMarkdownFile('tree_3.md', this)">├ 3 군집 Kmeans</li>
          <li class="tree-item" onclick="loadMarkdownFile('tree_4.md', this)">├ 4 군집 DBSCAN</li>
          <li class="tree-item" onclick="loadMarkdownFile('sin6.md', this)">├ 5 신용</li>
        </ul>
      </aside>

      <main class="viewer-panel" id="descViewer">
        <p style="text-align:center; opacity:0.5; padding-top: 80px;">문서를 불러오는 중입니다... ☁</p>
      </main>

    </div>
  </div>
  
  <div id="codeTab" class="tab-content">
    <main class="viewer-panel" id="codeViewer">
      <p style="text-align:center; opacity:0.5; padding-top: 80px;">ai2.md 문서를 불러오는 중입니다... ☁</p>
    </main>
  </div>

</div>

<script>
// 밤 모드 감지 테마 세팅
if (localStorage.getItem('theme') === 'night' || window.location.search.includes('theme=night')) {
  document.body.classList.add('night');
}

// 현재 활성화된 본문의 원본 HTML 보관 변수 (하이라이트 및 단어 검색용 초기화 데이터)
let currentOriginalHTML = "";

// 페이지 로드 시 기본 파일 자동 세팅
document.addEventListener("DOMContentLoaded", () => {
  loadMarkdownFile('ai.md', document.getElementById('baseFileBtn'));
  loadCodeFile('ai2.md');
});

// 🌟 마크다운 파일 요청 및 목차 강조(하이라이트) 처리 함수
function loadMarkdownFile(file, element) {
  // 목차 리스트 내 기존 active 클래스 전부 삭제 후 새로 클릭한 항목에 부여
  document.querySelectorAll('.tree-item, .tree-root').forEach(item => item.classList.remove('active'));
  if(element) element.classList.add('active');

  const viewer = document.getElementById('descViewer');
  viewer.innerHTML = `<p style="text-align:center; opacity:0.5; padding-top: 80px;">${file} 로드 중... ☁</p>`;
  
  fetch(file)
    .then(response => {
      if (!response.ok) throw new Error(`${file} 파일을 찾을 수 없습니다.`);
      return response.text();
    })
    .then(markdownText => {
      const parsedHTML = parseMarkdown(markdownText);
      viewer.innerHTML = parsedHTML;
      currentOriginalHTML = parsedHTML; // 현재 파일 원본 백업
      document.getElementById('searchInput').value = ""; // 검색창 초기화
    })
    .catch(err => {
      viewer.innerHTML = `<p style="color:red; text-align:center; padding-top:50px;">⚠️ 오류: ${err.message}</p>`;
      currentOriginalHTML = viewer.innerHTML;
    });
}

// 🌟 [코딩칸] 데이터 비동기 로드 함수
function loadCodeFile(file) {
  const viewer = document.getElementById('codeViewer');
  fetch(file)
    .then(response => {
      if (!response.ok) throw new Error(`${file} 파일을 찾을 수 없습니다.`);
      return response.text();
    })
    .then(markdownText => {
      viewer.innerHTML = parseMarkdown(markdownText);
    })
    .catch(err => {
      viewer.innerHTML = `<p style="color:red; text-align:center; padding-top:50px;">⚠️ 오류: ${err.message}</p>`;
    });
}

// 마크다운 파서 (코드 블록 안의 주석 보호 추가)
function parseMarkdown(md) {
  let html = md;
  
  // 1. 코드 블록 보호
  const codeBlocks = [];
  html = html.replace(/```(?:python|c|js|html|css|bash)?\n?([\s\S]*?)```/gm, function(match, p1) {
    codeBlocks.push('<pre><code>' + p1 + '</code></pre>');
    return '__CODE_BLOCK_' + (codeBlocks.length - 1) + '__';
  });
  
  // 2. 제목 및 인용구 변환
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
  html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
  
  // 3. 줄바꿈 p태그 감싸기
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (line.match(/<h|<block|<ul|<ol|<li|<pre|<code|__CODE_BLOCK_/)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');
  
  // 4. 보호된 코드 블록 복원
  codeBlocks.forEach((block, index) => {
    html = html.replace('__CODE_BLOCK_' + index + '__', block);
  });
  
  return html;
}

// 🔀 상단 탭 대분류 전환 함수
function switchTab(tabId, buttonElement) {
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  buttonElement.classList.add('active');
  
  // 탭 변경 시 검색 초기화
  document.getElementById('searchInput').value = "";
  if (tabId === 'descTab') {
    document.getElementById('descViewer').innerHTML = currentOriginalHTML;
  } else {
    loadCodeFile('ai2.md');
  }
}

// 🔍 단어 찾기 기능 (현재 활성화되어 있는 본문 판넬 영역 타겟팅)
function handleSearch() {
  const input = document.getElementById('searchInput').value.trim();
  const activeTab = document.querySelector('.tab-content.active');
  
  let targetViewer, baseHTML;
  
  if (activeTab.id === 'descTab') {
    targetViewer = document.getElementById('descViewer');
    baseHTML = currentOriginalHTML;
  } else {
    targetViewer = document.getElementById('codeViewer');
    // 코딩칸 검색 시 내부 하이라이트 태그 제거 후 원본화
    baseHTML = targetViewer.innerHTML.replace(/<span class="highlight">([\s\S]*?)<\/span>/g, '$1');
  }
  
  if (!input) {
    targetViewer.innerHTML = baseHTML;
    return;
  }
  
  targetViewer.innerHTML = baseHTML;
  const escapedInput = input.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(?<!<[^>]*)${escapedInput}`, 'gi');
  
  if (!regex.test(targetViewer.innerText)) {
    alert("현재 화면 본문에 찾는 단어가 없습니다! 🔍");
    return;
  }
  
  targetViewer.innerHTML = targetViewer.innerHTML.replace(regex, (match) => `<span class="highlight">${match}</span>`);
}
</script>

</body>
</html>
