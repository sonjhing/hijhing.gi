<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coding Cloud Garden - AI Lab</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght=700;900&family=Noto+Sans+KR:wght=400;700&display=swap');

:root {
  --sky1: #e0f4ff;
  --sky2: #bbf2c6;
  --text: #2c4c30;
  --card-bg: rgba(255, 255, 255, 0.9);
  --accent: #4fbf6a;
  --input-bg: #ffffff;
  --input-text: #333333;
  --tab-inactive: rgba(0, 0, 0, 0.05);
}

body.night {
  --sky1: #0b132b;
  --sky2: #1c2541;
  --text: #e1f5fe;
  --card-bg: rgba(30, 41, 59, 0.85);
  --accent: #a7f0a0;
  --input-bg: #1e293b;
  --input-text: #ffffff;
  --tab-inactive: rgba(255, 255, 255, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  transition: background 1.5s ease, color 1s;
}

/* 내비게이션 바 */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 900px;
  margin-bottom: 20px;
}

/* 홈 버튼 */
.home-btn {
  padding: 12px 24px;
  border-radius: 50px;
  border: none;
  background: var(--card-bg);
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.home-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

/* 찾기 상자 */
.search-box {
  display: flex;
  gap: 10px;
  background: var(--card-bg);
  padding: 6px 6px 6px 16px;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  align-items: center;
  width: 350px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 0.95rem;
  color: var(--input-text);
  width: 100%;
}
.search-box button {
  padding: 8px 20px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
body.night .search-box button { color: #112a1a; }
.search-box button:hover { opacity: 0.9; }

/* 탭 메뉴 스타일 */
.tab-container {
  display: flex;
  width: 100%;
  max-width: 900px;
  margin-bottom: -2px;
  gap: 5px;
  z-index: 2;
}
.tab-button {
  padding: 12px 30px;
  font-size: 1.05rem;
  font-weight: 700;
  border: none;
  border-radius: 16px 16px 0 0;
  background: var(--tab-inactive);
  color: var(--text);
  cursor: pointer;
  opacity: 0.6;
  transition: all 0.3s;
}
.tab-button.active {
  background: var(--card-bg);
  opacity: 1;
  box-shadow: 0 -5px 15px rgba(0,0,0,0.02);
}

/* 콘텐츠 카드 디자인 */
.content-card {
  width: 100%;
  max-width: 900px;
  background: var(--card-bg);
  border-radius: 0 24px 24px 24px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  line-height: 1.8;
  min-height: 500px;
}

/* 탭 내부 페이지 전환 제어 */
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}

/* [설명칸] 내부 레이아웃 (좌측 목차 / 우측 본문) */
.garden-layout {
  display: flex;
  gap: 30px;
}

/* 왼쪽 사이드바 트리 목차 */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  border-right: 2px solid rgba(0, 0, 0, 0.05);
  padding-right: 15px;
}
body.night .sidebar { border-right-color: rgba(255, 255, 255, 0.05); }

/* 트리 텍스트 가독성 */
.tree-root {
  font-size: 1.05rem;
  font-weight: 700;
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.03);
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 15px;
  display: block;
}
body.night .tree-root { background: rgba(255, 255, 255, 0.03); }

.tree-folder {
  font-size: 1.05rem;
  font-weight: 700;
  margin-top: 15px;
  margin-bottom: 5px;
  opacity: 0.9;
}
.tree-list {
  list-style: none;
  padding-left: 10px;
}
.tree-item {
  padding: 6px 12px;
  margin: 2px 0;
  font-size: 0.95rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  opacity: 0.8;
}
.tree-item:hover {
  background: rgba(0, 0, 0, 0.04);
  opacity: 1;
}
body.night .tree-item:hover { background: rgba(255, 255, 255, 0.04); }

/* 클릭 메뉴 하이라이터 */
.tree-item.active, .tree-root.active {
  background: var(--accent) !important;
  color: #ffffff !important;
  font-weight: 700;
  opacity: 1;
}
body.night .tree-item.active, body.night .tree-root.active { color: #112a1a !important; }

/* 우측 뷰어 판넬 */
.viewer-panel {
  flex-grow: 1;
  min-width: 0;
}

/* 마크다운 공통 렌더링 스타일 스타일 */
.viewer-panel h1 { font-size: 2.3rem; font-weight: 900; margin-bottom: 20px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; }
.viewer-panel h2 { font-size: 1.6rem; margin-top: 30px; margin-bottom: 15px; color: var(--accent); }
.viewer-panel h3 { font-size: 1.2rem; margin-top: 20px; margin-bottom: 10px; }
.viewer-panel p { margin-bottom: 15px; font-size: 1.05rem; opacity: 0.9; }
.viewer-panel ul, .viewer-panel ol { margin-left: 25px; margin-bottom: 20px; }
.viewer-panel li { margin-bottom: 5px; }
.viewer-panel blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: gray; margin: 15px 0; }

/* 💻 마크다운 내부의 코드 블록 스타일 가독성 업그레이드 */
.viewer-panel pre {
  background: var(--input-bg);
  color: var(--input-text);
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
  font-family: 'Courier New', Courier, monospace;
  margin: 15px 0;
  border: 1px solid rgba(0,0,0,0.05);
}
.viewer-panel code {
  font-family: 'Courier New', Courier, monospace;
  background: rgba(0,0,0,0.05);
  padding: 2px 6px;
  border-radius: 4px;
}
body.night .viewer-panel code { background: rgba(255,255,255,0.1); }

/* 찾기 하이라이트 */
.highlight {
  background-color: #ffeb3b;
  color: #000000;
  border-radius: 2px;
  padding: 0 2px;
}
</style>
</head>
<body>

          <li class="tree-item" onclick="loadMarkdownFile('regre_7.md', this)">├ 7 KNN/li>

<script>
// 밤 모드 감지 테마 세팅
if (localStorage.getItem('theme') === 'night' || window.location.search.includes('theme=night')) {
  document.body.classList.add('night');
}

// 현재 활성화된 본문의 원본 HTML 보관 변수 (하이라이트 및 단어 검색용 초기화 데이터)
let currentOriginalHTML = "";

// 페이지 로드 시 기본 파일 자동 세팅
document.addEventListener("DOMContentLoaded", () => {
  loadMarkdownFile('ai.md', document.getElementById('baseFileBtn'));
  loadCodeFile('ai2.md');
});

// 🌟 마크다운 파일 요청 및 목차 강조(하이라이트) 처리 함수
function loadMarkdownFile(file, element) {
  // 목차 리스트 내 기존 active 클래스 전부 삭제 후 새로 클릭한 항목에 부여
  document.querySelectorAll('.tree-item, .tree-root').forEach(item => item.classList.remove('active'));
  if(element) element.classList.add('active');

  const viewer = document.getElementById('descViewer');
  viewer.innerHTML = `<p style="text-align:center; opacity:0.5; padding-top: 80px;">${file} 로드 중... ☁</p>`;
  
  fetch(file)
    .then(response => {
      if (!response.ok) throw new Error(`${file} 파일을 찾을 수 없습니다.`);
      return response.text();
    })
    .then(markdownText => {
      const parsedHTML = parseMarkdown(markdownText);
      viewer.innerHTML = parsedHTML;
      currentOriginalHTML = parsedHTML; // 현재 파일 원본 백업
      document.getElementById('searchInput').value = ""; // 검색창 초기화
    })
    .catch(err => {
      viewer.innerHTML = `<p style="color:red; text-align:center; padding-top:50px;">⚠️ 오류: ${err.message}</p>`;
      currentOriginalHTML = viewer.innerHTML;
    });
}

// 🌟 [코딩칸] 데이터 비동기 로드 함수
function loadCodeFile(file) {
  const viewer = document.getElementById('codeViewer');
  fetch(file)
    .then(response => {
      if (!response.ok) throw new Error(`${file} 파일을 찾을 수 없습니다.`);
      return response.text();
    })
    .then(markdownText => {
      viewer.innerHTML = parseMarkdown(markdownText);
    })
    .catch(err => {
      viewer.innerHTML = `<p style="color:red; text-align:center; padding-top:50px;">⚠️ 오류: ${err.message}</p>`;
    });
}

// 마크다운 파서 (코드 블록 안의 주석 보호 추가)
function parseMarkdown(md) {
  let html = md;
  
  // 1. 코드 블록 보호
  const codeBlocks = [];
  html = html.replace(/```(?:python|c|js|html|css|bash)?\n?([\s\S]*?)```/gm, function(match, p1) {
    codeBlocks.push('<pre><code>' + p1 + '</code></pre>');
    return '__CODE_BLOCK_' + (codeBlocks.length - 1) + '__';
  });
  
  // 2. 제목 및 인용구 변환
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
  html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
  html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
  
  // 3. 줄바꿈 p태그 감싸기
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (line.match(/<h|<block|<ul|<ol|<li|<pre|<code|__CODE_BLOCK_/)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');
  
  // 4. 보호된 코드 블록 복원
  codeBlocks.forEach((block, index) => {
    html = html.replace('__CODE_BLOCK_' + index + '__', block);
  });
  
  return html;
}

// 🔀 상단 탭 대분류 전환 함수
function switchTab(tabId, buttonElement) {
  document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
  document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
  
  document.getElementById(tabId).classList.add('active');
  buttonElement.classList.add('active');
  
  // 탭 변경 시 검색 초기화
  document.getElementById('searchInput').value = "";
  if (tabId === 'descTab') {
    document.getElementById('descViewer').innerHTML = currentOriginalHTML;
  } else {
    loadCodeFile('ai2.md');
  }
}

// 🔍 단어 찾기 기능 (현재 활성화되어 있는 본문 판넬 영역 타겟팅)
function handleSearch() {
  const input = document.getElementById('searchInput').value.trim();
  const activeTab = document.querySelector('.tab-content.active');
  
  let targetViewer, baseHTML;
  
  if (activeTab.id === 'descTab') {
    targetViewer = document.getElementById('descViewer');
    baseHTML = currentOriginalHTML;
  } else {
    targetViewer = document.getElementById('codeViewer');
    // 코딩칸 검색 시 내부 하이라이트 태그 제거 후 원본화
    baseHTML = targetViewer.innerHTML.replace(/<span class="highlight">([\s\S]*?)<\/span>/g, '$1');
  }
  
  if (!input) {
    targetViewer.innerHTML = baseHTML;
    return;
  }
  
  targetViewer.innerHTML = baseHTML;
  const escapedInput = input.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(?<!<[^>]*)${escapedInput}`, 'gi');
  
  if (!regex.test(targetViewer.innerText)) {
    alert("현재 화면 본문에 찾는 단어가 없습니다! 🔍");
    return;
  }
  
  targetViewer.innerHTML = targetViewer.innerHTML.replace(regex, (match) => `<span class="highlight">${match}</span>`);
}

// ⚙️ AutoML 파이프라인 빌더 렌더링 함수

  const builderHTML = `
    <h1>⚙️ AI 파이프라인 자동화 빌더</h1>
    <p>변수 선택부터 실제 서비스 환경 구축까지, 클릭만으로 나만의 완벽한 <strong>실전 파이썬 코드</strong>를 생성하세요!</p>
    
    <div style="background:var(--input-bg); padding:25px; border-radius:16px; margin-top:20px; border:2px solid var(--accent); box-shadow:0 10px 30px rgba(0,0,0,0.05);">
      <h3 style="margin-top:0; color:var(--accent);">Step 1. 변수 선택 (Feature Selection)</h3>
      <div style="margin-bottom:20px;">
        <label style="font-weight:700;">추출할 핵심 피처(변수) 개수:</label>
        <input type="number" id="pb_features" value="5" min="1" max="15" style="width:80px; padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.2); margin-left:10px;"> 개
      </div>

      <h3 style="color:var(--accent);">Step 2. 최적 모델 탐색 (GridSearchCV)</h3>
      <div style="margin-bottom:10px;">
        <label style="font-weight:700; display:inline-block; width:180px;">그리드서치 탐색 강도:</label>
        <select id="pb_depth" style="padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.2);">
          <option value="light">가볍게 (시험용 추천, 빠름)</option>
          <option value="heavy">정밀하게 (점수 극대화, 오래걸림)</option>
        </select>
      </div>
      <div style="margin-bottom:20px;">
        <label style="font-weight:700; display:inline-block; width:180px;">데이터 불균형 가중치:</label>
        <select id="pb_weight" style="padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.2);">
          <option value="balanced">자동 맞춤 (balanced)</option>
          <option value="{0: 1, 1: 5}">1:5 가중치</option>
          <option value="{0: 1, 1: 7}">1:7 가중치 (추천)</option>
          <option value="{0: 1, 1: 10}">1:10 가중치 (불균형 극심할 때)</option>
        </select>
      </div>

      <h3 style="color:var(--accent);">Step 3. 서비스 환경 구축 (Deployment)</h3>
      <div style="margin-bottom:20px;">
        <label style="font-weight:700;">시험장 평가용 데이터 파일명:</label>
        <input type="text" id="pb_filename" value="test.csv" style="width:200px; padding:8px; border-radius:8px; border:1px solid rgba(0,0,0,0.2); margin-left:10px;">
      </div>

      <button onclick="generatePipelineCode()" style="width:100%; padding:15px; border-radius:12px; background:var(--accent); color:#fff; font-size:1.1rem; font-weight:900; border:none; cursor:pointer; margin-top:10px; box-shadow:0 5px 15px rgba(79, 191, 106, 0.3);">
        🚀 완벽한 파이썬 코드 생성하기!
      </button>
    </div>

    <div id="generatedCodeArea" style="margin-top:30px; display:none;">
      <h2>✅ 당신만의 파이프라인 완성본</h2>
      <p>아래 코드를 복사하여 Jupyter Notebook 셀에 차례대로 붙여넣고 실행하세요.</p>
      <pre><code id="generatedCode" style="display:block; padding:15px; font-family:'Courier New', Courier, monospace; overflow-x:auto; line-height:1.5;"></code></pre>
    </div>
  `;
  
  viewer.innerHTML = builderHTML;
  currentOriginalHTML = builderHTML;
}

// ⚙️ 파이프라인 코드 생성기 로직
function generatePipelineCode() {
  const featCount = document.getElementById('pb_features').value;
  const depth = document.getElementById('pb_depth').value;
  const weight = document.getElementById('pb_weight').value;
  const testFile = document.getElementById('pb_filename').value;

  let depthParams = "";
  if (depth === "light") {
    depthParams = "'n_estimators': [100, 200],\n    'max_depth': [5, 8]";
  } else {
    depthParams = "'n_estimators': [100, 200, 300],\n    'max_depth': [5, 8, 10, None]";
  }

  let weightStr = weight === "balanced" ? "'balanced'" : weight;

  const pythonCode = `import pandas as pd
import numpy as np
import joblib
import os
from sklearn.model_selection import StratifiedKFold, GridSearchCV
from sklearn.preprocessing import StandardScaler
from sklearn.ensemble import RandomForestClassifier
from sklearn.metrics import classification_report, f1_score

# ==========================================
# [Step 1] 데이터 로드 및 피처 중요도 분석
# ==========================================
df = pd.read_csv("train.csv")
TARGET = "target"
X = df.drop(TARGET, axis=1)
y = df[TARGET]

rf_importance = RandomForestClassifier(random_state=42)
rf_importance.fit(X, y)

importance_df = pd.DataFrame({
    "Feature": X.columns,
    "Importance": rf_importance.feature_importances_
}).sort_values(by="Importance", ascending=False)

# 상위 ${featCount}개의 핵심 피처만 골라냅니다!
top_features = importance_df["Feature"].head(${featCount}).tolist()
print("선택된 핵심 Feature:", top_features)

X_selected = X[top_features]

# ==========================================
# [Step 2] 스케일링 & GridSearchCV 최적 모델 탐색
# ==========================================
scaler = StandardScaler()
X_selected_scaled = scaler.fit_transform(X_selected)

param_grid = {
    ${depthParams},
    'class_weight': [${weightStr}]
}

cv = StratifiedKFold(n_splits=5, shuffle=True, random_state=42)
rf = RandomForestClassifier(random_state=42)

grid_search = GridSearchCV(estimator=rf, param_grid=param_grid, cv=cv, scoring='f1_macro', n_jobs=-1)
grid_search.fit(X_selected_scaled, y)

best_model = grid_search.best_estimator_
print("찾아낸 최고의 파라미터:", grid_search.best_params_)

joblib.dump(best_model, "best_model.pkl")
joblib.dump(scaler, "scaler.pkl")
joblib.dump(top_features, "selected_features.pkl")
print("▶ 모델, 스케일러, 피처 목록 저장 완료!")

# ==========================================
# [Step 3] 실제 서비스 환경 구축 (테스트 및 배포)
# ==========================================
if os.path.exists("${testFile}"):

    # 저장해둔 피처와 스케일러로 똑같이 환경 세팅

    if TARGET in test_df.columns:
        print("===== 최종 채점 성적표 =====")
        print(classification_report(test_df[TARGET], pred))
        print(f"최종 기말 점수: {f1_score(test_df[TARGET], pred, average='macro'):.4f}")
    
    # 제출 파일 저장
    pd.DataFrame({'prediction': pred}).to_csv("submission.csv", index=False)
    print("제출 파일 생성 완료!")
else:
    print("${testFile} 파일이 없어서 테스트를 건너뜁니다.")
