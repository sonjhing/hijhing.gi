<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coding Cloud Garden - AI Lab</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+KR:wght@400;700&display=swap');

:root {
  --sky1: #e0f4ff;
  --sky2: #bbf2c6;
  --text: #2c4c30;
  --card-bg: rgba(255, 255, 255, 0.9);
  --accent: #4fbf6a;
  --input-bg: #ffffff;
  --input-text: #333333;
  --tab-inactive: rgba(0, 0, 0, 0.05);
}

body.night {
  --sky1: #0b132b;
  --sky2: #1c2541;
  --text: #e1f5fe;
  --card-bg: rgba(30, 41, 59, 0.85);
  --accent: #a7f0a0;
  --input-bg: #1e293b;
  --input-text: #ffffff;
  --tab-inactive: rgba(255, 255, 255, 0.05);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html {
  scroll-behavior: smooth; /* 목차 클릭 시 부드럽게 스크롤 */
}

body {
  font-family: 'Noto Sans KR', 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  transition: background 1.5s ease, color 1s;
}

/* 상단 내비게이션 바 */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 1000px;
  margin-bottom: 20px;
}

/* 홈 버튼 */
.home-btn {
  padding: 12px 24px;
  border-radius: 50px;
  border: none;
  background: var(--card-bg);
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  transition: transform 0.3s, box-shadow 0.3s;
}
.home-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

/* 찾기 상자 */
.search-box {
  display: flex;
  gap: 10px;
  background: var(--card-bg);
  padding: 6px 6px 6px 16px;
  border-radius: 50px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  align-items: center;
  width: 350px;
}
.search-box input {
  border: none;
  background: transparent;
  outline: none;
  font-size: 0.95rem;
  color: var(--input-text);
  width: 100%;
}
.search-box button {
  padding: 8px 20px;
  border-radius: 50px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  cursor: pointer;
  transition: opacity 0.2s;
}
body.night .search-box button { color: #112a1a; }
.search-box button:hover { opacity: 0.9; }

/* 메인 레이아웃 래퍼 (사이드바 + 콘텐츠) */
.main-wrapper {
  display: flex;
  width: 100%;
  max-width: 1000px;
  gap: 30px;
  align-items: flex-start;
}

/* 🌟 고정된 사이드바(목차) 스타일 */
.sidebar {
  position: sticky;
  top: 40px;
  width: 200px;
  flex-shrink: 0;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.sidebar-title {
  font-weight: 900;
  font-size: 1.1rem;
  margin-bottom: 10px;
  text-align: center;
  color: var(--accent);
}
.sidebar a {
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  padding: 12px 15px;
  border-radius: 12px;
  background: var(--tab-inactive);
  transition: all 0.3s;
  font-size: 0.95rem;
}
.sidebar a:hover {
  background: var(--accent);
  color: #fff;
  transform: translateX(5px);
}
body.night .sidebar a:hover { color: #112a1a; }

/* 콘텐츠 카드 디자인 */
.content-card {
  flex-grow: 1;
  background: var(--card-bg);
  border-radius: 24px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(10px);
  line-height: 1.8;
  min-height: 600px;
  min-width: 0; /* Flex 버그 방지 */
}

/* 마크다운 공통 렌더링 스타일 */
.content-card h1 { font-size: 2.3rem; font-weight: 900; margin-bottom: 20px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; margin-top: 40px; }
.content-card h1:first-child { margin-top: 0; }
.content-card h2 { font-size: 1.6rem; margin-top: 30px; margin-bottom: 15px; color: var(--accent); }
.content-card h3 { font-size: 1.2rem; margin-top: 20px; margin-bottom: 10px; }
.content-card p { margin-bottom: 15px; font-size: 1.05rem; opacity: 0.9; }
.content-card ul, .content-card ol { margin-left: 25px; margin-bottom: 20px; }
.content-card li { margin-bottom: 5px; }
.content-card blockquote { border-left: 4px solid var(--accent); padding-left: 15px; color: gray; margin: 15px 0; }

/* 💻 마크다운 내부의 코드 블록 스타일 */
.content-card pre {
  background: var(--input-bg);
  color: var(--input-text);
  padding: 15px;
  border-radius: 10px;
  overflow-x: auto;
  font-family: 'Courier New', Courier, monospace;
  margin: 15px 0;
  border: 1px solid rgba(0,0,0,0.05);
}
.content-card code {
  font-family: 'Courier New', Courier, monospace;
  background: rgba(0,0,0,0.05);
  padding: 2px 6px;
  border-radius: 4px;
}
body.night .content-card code { background: rgba(255,255,255,0.1); }

/* 찾기 하이라이트 */
.highlight {
  background-color: #ffeb3b;
  color: #000000;
  border-radius: 2px;
  padding: 0 2px;
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="index.html" class="home-btn" target="_self">🌳 고 가든</a>
  
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="본문 단어 검색..." onkeypress="if(event.key === 'Enter') handleSearch()">
    <button onclick="handleSearch()">찾기</button>
  </div>
</div>

<div class="main-wrapper">
  <!-- 🌟 사이드바 목차 영역 -->
  <nav class="sidebar">
    <div class="sidebar-title">목차 (TOC)</div>
    <!-- 임시로 Section 1 ~ 7로 지정 -->
    <a href="#section-1">Section 1</a>
    <a href="#section-2">Section 2</a>
    <a href="#section-3">Section 3</a>
    <a href="#section-4">Section 4</a>
    <a href="#section-5">Section 5</a>
    <a href="#section-6">Section 6</a>
    <a href="#section-7">Section 7</a>
  </nav>

  <!-- 🌟 통합된 콘텐츠 영역 -->
  <div class="content-card">
    <div id="mainContent">
      <p style="text-align:center; opacity:0.5; padding-top: 50px;">s3py.md 문서를 불러오는 중입니다... ☁️</p>
    </div>
  </div>
</div>

<script>
// 밤 모드 감지 테마 세팅
if (localStorage.getItem('theme') === 'night' || window.location.search.includes('theme=night')) {
  document.body.classList.add('night');
}

// 원본 HTML을 저장할 변수 (검색 초기화용)
let originalHTML = "";

// 🌟 s3py.md 파일 단일로 가져오기 (설명+코드 통합)
fetch('s3py.md')
  .then(response => {
    if (!response.ok) throw new Error('s3py.md 파일을 찾을 수 없습니다.');
    return response.text();
  })
  .then(markdownText => {
    const htmlContent = parseMarkdown(markdownText);
    const container = document.getElementById('mainContent');
    container.innerHTML = htmlContent;
    originalHTML = container.innerHTML;
  })
  .catch(err => {
    document.getElementById('mainContent').innerHTML = `<p style="color:red; text-align:center; padding-top:50px;">⚠️ 오류: ${err.message}</p>`;
  });

// 마크다운 파서 (코드 블록 안의 주석 보호 및 h1 태그 ID 자동 부여)
function parseMarkdown(md) {
  let html = md;
  
  // 1. 코드 블록 보호
  const codeBlocks = [];
  html = html.replace(/```(?:python|c|js|html|css|bash)?\n?([\s\S]*?)```/gm, function(match, p1) {
    codeBlocks.push('<pre><code>' + p1 + '</code></pre>');
    return '__CODE_BLOCK_' + (codeBlocks.length - 1) + '__';
  });
  
  // 2. 제목 및 인용구 변환
  html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
  html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
  
  // h1 태그 변환 시 사이드바 연동을 위한 id="section-X" 순차적 부여
  let h1Count = 1;
  html = html.replace(/^# (.*$)/gim, function(match, p1) {
    if (h1Count <= 7) {
      const id = 'section-' + h1Count;
      h1Count++;
      return '<h1 id="' + id + '">' + p1 + '</h1>';
    } else {
      return '<h1>' + p1 + '</h1>';
    }
  });

  html = html.replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>');
  html = html.replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>');
  
  // 3. 줄바꿈 p태그 감싸기
  html = html.split('\n').map(line => {
    if (!line.trim()) return '';
    if (line.match(/<h|<block|<ul|<ol|<li|<pre|<code|__CODE_BLOCK_/)) return line;
    return '<p>' + line + '</p>';
  }).join('\n');
  
  // 4. 보호된 코드 블록 복원
  codeBlocks.forEach((block, index) => {
    html = html.replace('__CODE_BLOCK_' + index + '__', block);
  });
  
  return html;
}

// 🔍 단어 찾기 기능
function handleSearch() {
  const input = document.getElementById('searchInput').value.trim();
  const activeTab = document.getElementById('mainContent');
  
  if (!input) {
    activeTab.innerHTML = originalHTML;
    return;
  }
  
  activeTab.innerHTML = originalHTML;
  const escapedInput = input.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(?<!<[^>]*)${escapedInput}`, 'gi');
  
  if (!regex.test(activeTab.innerText)) {
    alert("현재 본문에 찾는 단어가 없습니다! 🔍");
    return;
  }
  
  activeTab.innerHTML = activeTab.innerHTML.replace(regex, (match) => `<span class="highlight">${match}</span>`);
}
</script>

</body>
</html>
