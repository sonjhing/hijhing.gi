<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Coding Cloud Garden - Projects</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght=700;900&family=Noto+Sans+KR:wght@400;700&display=swap');

:root {
  --sky1: #e0f4ff;
  --sky2: #bbf2c6;
  --text: #2c4c30;
  --card-bg: rgba(255, 255, 255, 0.9);
  --accent: #4fbf6a;
  --slot-bg: rgba(255, 255, 255, 0.75);
  --slot-border: rgba(79, 191, 106, 0.35);
  --slot-hover-border: #4fbf6a;
  --slot-text: #2c4c30;
}

body.night {
  --sky1: #0b132b;
  --sky2: #1c2541;
  --text: #e1f5fe;
  --card-bg: rgba(30, 41, 59, 0.85);
  --accent: #a7f0a0;
  --slot-bg: rgba(30, 41, 59, 0.7);
  --slot-border: rgba(167, 240, 160, 0.25);
  --slot-hover-border: #a7f0a0;
  --slot-text: #e1f5fe;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 40px 20px;
  transition: background 1.5s ease, color 1s;
}

/* 상단 내비게이션 바 */
.nav-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  max-width: 960px;
  margin-bottom: 25px;
}

.home-btn {
  padding: 12px 24px;
  border-radius: 50px;
  border: none;
  background: var(--card-bg);
  color: var(--text);
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 8px;
  backdrop-filter: blur(10px);
  transition: transform 0.3s, box-shadow 0.3s;
}
.home-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}

.header-title {
  font-size: 1.1rem;
  font-weight: 800;
  opacity: 0.8;
}

/* 메인 컨테이너 */
.container {
  width: 100%;
  max-width: 960px;
  background: var(--card-bg);
  border-radius: 28px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(12px);
}

.title-area {
  text-align: center;
  margin-bottom: 35px;
}
.title-area h1 {
  font-size: 2.3rem;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 10px;
}
.title-area p {
  font-size: 1.05rem;
  opacity: 0.85;
}

/* 6개 그리드 레이아웃 */
.grid-box {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

@media (max-width: 768px) {
  .grid-box {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 500px) {
  .grid-box {
    grid-template-columns: 1fr;
  }
}

/* 카드 슬롯 스타일 */
.slot-card {
  background: var(--slot-bg);
  border: 2px dashed var(--slot-border);
  border-radius: 20px;
  min-height: 200px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  position: relative;
  text-decoration: none;
  color: var(--slot-text);
}

/* 활성화된 프로젝트 카드 (1번 슬롯) */
.slot-card.active {
  border-style: solid;
  border-color: var(--accent);
  box-shadow: 0 10px 25px rgba(0,0,0,0.06);
  cursor: pointer;
}
.slot-card.active:hover {
  transform: translateY(-6px) scale(1.02);
  box-shadow: 0 16px 35px rgba(79, 191, 106, 0.25);
  border-color: var(--accent);
}

.slot-card.empty {
  cursor: default;
  opacity: 0.7;
}
.slot-card.empty:hover {
  border-color: var(--slot-hover-border);
  opacity: 0.9;
}

.slot-badge {
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 4px 10px;
  border-radius: 20px;
  background: rgba(0, 0, 0, 0.06);
  color: var(--text);
}
body.night .slot-badge {
  background: rgba(255, 255, 255, 0.1);
}

.slot-icon {
  font-size: 2.8rem;
  margin-bottom: 12px;
}

.slot-title {
  font-size: 1.25rem;
  font-weight: 800;
  margin-bottom: 6px;
}

.slot-desc {
  font-size: 0.9rem;
  opacity: 0.8;
  line-height: 1.4;
}
</style>
</head>
<body>

<div class="nav-bar">
  <a href="index.html" class="home-btn" target="_self">🌳 고 가든</a>
  <span class="header-title">📁 Project Space</span>

    <a href="heal1.html" class="slot-card active" id="slot1">

    </div>
  </div>
</div>

<script>
// 밤 모드 유지 세팅
if (localStorage.getItem('theme') === 'night' || window.location.search.includes('theme=night')) {
  document.body.classList.add('night');
}
</script>

</body>
</html>
