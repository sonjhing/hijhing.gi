<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 모델 추천기 - 고 가든</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap');

:root {
  --sky1: #e0f4ff;
  --sky2: #bbf2c6;
  --text: #2c4c30;
  --card-bg: rgba(255, 255, 255, 0.9);
  --accent: #4fbf6a;
  --accent-hover: #3da556;
  --input-bg: #ffffff;
  --input-border: rgba(0, 0, 0, 0.1);
  --result-bg: rgba(79, 191, 106, 0.1);
}

body.night {
  --sky1: #0b132b;
  --sky2: #1c2541;
  --text: #e1f5fe;
  --card-bg: rgba(30, 41, 59, 0.85);
  --accent: #a7f0a0;
  --accent-hover: #8ae083;
  --input-bg: #1e293b;
  --input-border: rgba(255, 255, 255, 0.1);
  --result-bg: rgba(167, 240, 160, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Sans KR', 'Nunito', sans-serif;
  min-height: 100vh;
  background: linear-gradient(to bottom, var(--sky1), var(--sky2));
  background-attachment: fixed;
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
  transition: background 1.5s ease, color 1s;
}

/* 홈으로 가기 버튼 */
.nav-bar {
  position: absolute;
  top: 40px;
  left: 40px;
}
.home-btn {
  padding: 12px 24px;
  border-radius: 50px;
  background: var(--card-bg);
  color: var(--text);
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  transition: all 0.3s;
}
.home-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }

/* 메인 카드 */
.card {
  background: var(--card-bg);
  padding: 50px;
  border-radius: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.1);
  backdrop-filter: blur(15px);
  max-width: 600px;
  width: 100%;
  text-align: center;
}

.title {
  font-size: 2.2rem;
  font-weight: 900;
  margin-bottom: 10px;
  color: var(--accent);
}

.subtitle {
  font-size: 1.1rem;
  opacity: 0.8;
  margin-bottom: 40px;
}

/* 입력 폼 */
.input-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 30px;
}

.input-box {
  position: relative;
}

.input-box input {
  width: 100%;
  padding: 16px 20px;
  border-radius: 15px;
  border: 2px solid var(--input-border);
  background: var(--input-bg);
  color: var(--text);
  font-size: 1.1rem;
  font-weight: 700;
  outline: none;
  transition: all 0.3s;
  text-align: center;
}

.input-box input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 15px rgba(79, 191, 106, 0.2);
}

/* 추천 버튼 */
.submit-btn {
  width: 100%;
  padding: 18px;
  border-radius: 15px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 1.2rem;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.3s;
  box-shadow: 0 10px 20px rgba(79, 191, 106, 0.3);
}
body.night .submit-btn { color: #112a1a; box-shadow: 0 10px 20px rgba(167, 240, 160, 0.2); }
.submit-btn:hover {
  background: var(--accent-hover);
  transform: translateY(-2px);
}

/* 결과 출력 영역 */
.result-area {
  margin-top: 30px;
  padding: 30px;
  border-radius: 20px;
  background: var(--result-bg);
  display: none; /* 처음엔 숨김 */
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.result-title {
  font-size: 1.2rem;
  font-weight: 700;
  margin-bottom: 15px;
  opacity: 0.9;
}

.result-model {
  font-size: 2.5rem;
  font-weight: 900;
  color: var(--accent);
  margin-bottom: 15px;
}

.result-desc {
  font-size: 1.05rem;
  line-height: 1.6;
}

/* 추천 모델 태그 */
.tags {
  margin-top: 20px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.tag {
  background: var(--accent);
  color: #fff;
  padding: 5px 12px;
  border-radius: 50px;
  font-size: 0.85rem;
  font-weight: 700;
}
body.night .tag { color: #112a1a; }
</style>

     "복잡한패턴", "패턴학습", "분류", "회귀", "다중분류", "수치예측", "범주예측", "결측값처리", "자동처리", "랜덤포레스트대안", 
     "XGBoost", "LightGBM", "부스팅계열", "캐글", "대회용", "고급모델"],
    desc: "데이터 양이 방대하거나 결측치(빈칸)가 포함되어 있을 때 알아서 처리해 주는 최신 고급 앙상블 기법입니다. 시험장에서 에러 없이 가장 빠르고 강력한 점수를 보장하는 비상용 필살기입니다.",
    tags: ["최고성능", "결측치자동처리", "과적합방지"]
  }
];

function recommendModel() {
  const k1 = document.getElementById('kw1').value.trim().toLowerCase();
  const k2 = document.getElementById('kw2').value.trim().toLowerCase();
  const k3 = document.getElementById('kw3').value.trim().toLowerCase();
  
  const inputKeywords = [k1, k2, k3].filter(k => k !== "");
  
  if (inputKeywords.length === 0) {
    alert("키워드를 최소 1개 이상 입력해주세요!");
    return;
  }

  // 각 모델별로 매칭 점수 계산
  let bestModel = models[1]; // 기본값: 랜덤포레스트 (제일 무난함)
  let maxScore = -1;

  for (let model of models) {
    let score = 0;
    for (let word of inputKeywords) {
      // 키워드가 모델의 키워드 목록에 포함되거나 비슷하면 점수 +1
      for (let mKw of model.keywords) {
        if (word.includes(mKw) || mKw.includes(word)) {
          score += 1;
        }
      }
    }
    
    // 동점일 경우 조금 더 우선순위를 줄 수도 있지만, 일단 최고점 갱신 시 변경
    if (score > maxScore) {
      maxScore = score;
      bestModel = model;
    }
  }

  // 완전 매칭이 하나도 없으면 (maxScore == 0) 랜덤 포레스트 추천
  if (maxScore === 0) {
    bestModel = models[1]; // 랜덤 포레스트
    bestModel.desc = "입력하신 키워드에 딱 떨어지는 특정 모델을 찾기 어렵습니다. 하지만 이런 경우 대부분 **랜덤 포레스트**가 가장 무난하고 강력한 성능을 발휘합니다!";
  }

  // 결과 화면에 렌더링
  document.getElementById('resultModel').innerText = bestModel.name;
  
  // 설명을 마크다운처럼 강조(볼드체) 처리
  let formattedDesc = bestModel.desc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  document.getElementById('resultDesc').innerHTML = formattedDesc;

  // 태그 생성
  const tagsContainer = document.getElementById('resultTags');
  tagsContainer.innerHTML = "";
  bestModel.tags.forEach(tag => {
    const span = document.createElement('span');
    span.className = 'tag';
    span.innerText = "#" + tag;
    tagsContainer.appendChild(span);
  });

  // 결과 영역 보여주기
  const resultArea = document.getElementById('resultArea');
  resultArea.style.display = 'block';
  
  // 부드럽게 스크롤
  resultArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
}
</script>
